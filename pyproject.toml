[project]
name = "athletiq"
version = "0.1.0"
description = "AthletIQ — functional prototype: context-aware football analytics, AI scouting, and single-camera CV pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "AthletIQ Research Division" }]

dependencies = [
  # scientific core
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "shapely>=2.0,<3",
  # optimization
  "pulp>=2.7,<3",
  # api
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "aiofiles>=23.2,<25",
  "orjson>=3.10,<4",
  # data
  "pyarrow>=15,<21",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  # cv (heavier — installed in api/worker image; optional extras mirror this)
  "opencv-python-headless>=4.9,<5",
  "pillow>=10.2,<12",
]

[project.optional-dependencies]
cv = [
  # pinned to versions that resolve on CPU without CUDA toolchain
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "ultralytics>=8.2,<9",
  "supervision>=0.20,<1",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=4.1,<6",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.4,<1",
  "mypy>=1.9,<2",
  "types-requests",
  "jupyter>=1.0,<2",
  "matplotlib>=3.8,<4",
]
statsbomb = [
  "statsbombpy>=1.13,<2",
]

[project.scripts]
athletiq = "athletiq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athletiq"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET"]
ignore = [
  "E501",  # handled by formatter
  "N803",  # allow math-style variable names (W, H, P_r, etc.)
  "N806",
  "N802",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]
"src/athletiq/metrics/**" = ["N803", "N806"]  # paper uses math symbols
"src/athletiq/api/**" = ["B008"]  # FastAPI's Depends() is meant to be a default

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: slow tests (skipped by default unless --runslow)",
  "cv: requires torch/ultralytics extras",
  "integration: integration tests requiring external services",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src/athletiq"]
